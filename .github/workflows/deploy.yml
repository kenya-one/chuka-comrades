
name: Deploy Chuka Comrades to GitHub Pages

on:
  push:
    branches:
      - index
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

          VITE_CHUKA_SOKO_API_URL: ${{ secrets.VITE_CHUKA_SOKO_API_URL }}
          VITE_EFOOTBALL_API_URL: ${{ secrets.VITE_EFOOTBALL_API_URL }}
          VITE_GAMES_API_URL: ${{ secrets.VITE_GAMES_API_URL }}

          VITE_HOSTEL_API_URL: ${{ secrets.VITE_HOSTEL_API_URL }}

          VITE_OZONE_API_URL: ${{ secrets.VITE_OZONE_API_URL }}
          VITE_OZONE_MPESA_TILL: ${{ secrets.VITE_OZONE_MPESA_TILL }}
          VITE_OZONE_NGL_URL: ${{ secrets.VITE_OZONE_NGL_URL }}
          VITE_OZONE_WHATSAPP_CHANNEL_URL: ${{ secrets.VITE_OZONE_WHATSAPP_CHANNEL_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
